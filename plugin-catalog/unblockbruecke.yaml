name: unblockbruecke
title: Unblockbrücke
repo: https://github.com/studioluftbruecke/hermes-unblockbruecke
sha: 0aeeb7dbfff8650b21fe19e6d339af8b2a79e502
description: "Cards to unblock yourself or your agent, drawn by you when you are stuck and by Hermes when its tool calls keep failing. Disclosure — With auto-draw switched on (off by default), once 3 of the last 5 tool calls in a turn failed it adds one card's text to that failing result (one card per turn), so the model reads it, and adds one line naming the card after that turn's reply (not in scheduled jobs, webhooks, the API server or single-query runs); the agent's deck tool can import a deck from any file path and export a .yaml deck file to any folder you name (attended chats only, never overwriting a non-deck file); the page's settings switches save through a short `hermes config set` child process."
maintainer: studioluftbruecke
tier: community
category: desktop
requires_hermes: ">=0.23.0"
docs_url: https://unblockbruecke.luftbruecke.studio
version: "0.2.3"
image: https://raw.githubusercontent.com/studioluftbruecke/hermes-unblockbruecke/0aeeb7dbfff8650b21fe19e6d339af8b2a79e502/docs/banner.png
